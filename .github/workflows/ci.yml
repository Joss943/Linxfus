name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: shellcheck -S warning linxfus tests/run.sh
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update -q && sudo apt-get install -yq parted dosfstools rsync wimtools grub-pc-bin grub2-common dmg2img xorriso
      - run: sudo REQUIRE_BIOS=1 tests/run.sh
